<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qiu Gavin — 互動實驗索引</title>
  <meta name="description" content="Qiu Gavin 的互動實驗索引：遊戲、教具、演算法視覺化與工具，全部純前端。">
  <meta name="author" content="Qiu Gavin">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Qiu Gavin — 互動實驗索引">
  <meta property="og:title" content="Qiu Gavin — 互動實驗索引">
  <meta property="og:description" content="把好奇，做成可以玩的東西。遊戲、教具、演算法視覺化與工具，全部純前端。">
  <meta property="og:url" content="https://qiugavintw.github.io/QiuGavintwproduct.github.io/">
  <meta property="og:image" content="https://qiugavintw.github.io/QiuGavintwproduct.github.io/assets/thumbnails/cephalopod.png">
  <meta property="og:locale" content="zh_TW">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Qiu Gavin — 互動實驗索引">
  <meta name="twitter:description" content="把好奇，做成可以玩的東西。">
  <meta name="twitter:image" content="https://qiugavintw.github.io/QiuGavintwproduct.github.io/assets/thumbnails/cephalopod.png">

  <link rel="canonical" href="https://qiugavintw.github.io/QiuGavintwproduct.github.io/">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <meta name="theme-color" content="#f3f2ed">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Source+Serif+4:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/index.css">

  <!-- 載入前即套用主題，避免閃白 -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("qg-theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <header class="site-head">
    <div class="wrap head-inner">
      <a class="brand" href="./index.html">
        <span class="brand-mark">Qiu&nbsp;Gavin</span>
        <span class="brand-sub mono">互動實驗索引</span>
      </a>
      <div class="head-meta">
        <span class="mono hide-sm">EST. 2026 · 澎湖</span>
        <a class="head-link mono" href="about.html">舊版介紹</a>
        <button class="theme-btn mono" type="button" data-theme-btn aria-label="切換日夜模式">
          <span data-theme-label>夜讀</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="wrap hero-grid">
        <div>
          <span class="hero-kicker mono">一個前端實驗者的作品索引</span>
          <h1 class="hero-title">把好奇，<br>做成<em>可以玩</em>的東西。</h1>
          <p class="hero-lede">從澎湖的頭足類、演算法動畫，到打字訓練與課堂工具——每一件互動實驗，全部以純前端打造，打開瀏覽器就能玩。</p>
          <p class="hero-stats mono">
            <span><b data-total>9</b> 件作品</span>
            <span><b data-cat-count>5</b> 種分類</span>
            <span><b>100%</b> 純前端</span>
          </p>
        </div>

        <figure class="specimen">
          <a class="specimen-plate" href="projects/cephalopod/play/" aria-label="打開澎湖頭足探險">
            <img src="assets/thumbnails/cephalopod.png" alt="澎湖頭足探險遊戲畫面">
            <span class="specimen-tab" data-specimen-tab>E·06 · 精選</span>
          </a>
          <figcaption class="specimen-label">
            <span class="lbl"><span class="dot" style="--c:#0e9ad8"></span> Featured Specimen</span>
            <h2>澎湖頭足探險</h2>
            <p>依季節、時間與棲地捕撈 16 種真實頭足類，內建海洋圖鑑與保育知識的互動教育遊戲。</p>
            <div class="specimen-meta mono">
              <span>遊戲 / 教育</span>
              <span>Canvas · Web Audio</span>
              <span>2026.08</span>
            </div>
            <a class="specimen-link" href="projects/cephalopod/">查看詳情 <span aria-hidden="true">↗</span></a>
          </figcaption>
        </figure>
      </div>
    </section>

    <!-- INDEX -->
    <section class="wrap" aria-labelledby="index-title">
      <div class="index-head">
        <h2 id="index-title">索引 · Index</h2>
        <span class="mono" data-index-count>共 9 件</span>
      </div>

      <div class="index-layout">
        <aside class="rail" aria-label="分類篩選">
          <p class="rail-label mono">依分類瀏覽</p>
          <ul class="filter-list" data-filters></ul>
          <p class="rail-note mono">每件作品都標上索引號與日期，方便引用與比較。</p>
        </aside>

        <div>
          <div class="plates" data-plates></div>
          <p class="empty-note" data-empty>這個分類目前沒有作品。</p>
          <noscript><p class="empty-note show">請開啟 JavaScript 以瀏覽作品索引。</p></noscript>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <div class="wrap foot-inner mono">
      <span>© 2026 Qiu Gavin · 以純前端打造</span>
      <a href="about.html">舊版介紹 ↗</a>
      <a href="https://github.com/QiuGavintw/QiuGavintwproduct.github.io" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </footer>

  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

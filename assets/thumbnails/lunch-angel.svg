<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1e4f"/>
      <stop offset="0.5" stop-color="#4a2e7a"/>
      <stop offset="1" stop-color="#1c1233"/>
    </linearGradient>
    <linearGradient id="chat1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06c755"/>
      <stop offset="1" stop-color="#0aa547"/>
    </linearGradient>
    <linearGradient id="chat2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f0f5"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- phone mockup -->
  <rect x="620" y="150" width="360" height="640" rx="36" fill="#111" stroke="#333" stroke-width="2"/>
  <rect x="636" y="172" width="328" height="596" rx="24" fill="#fafafa"/>
  <rect x="636" y="172" width="328" height="56" rx="24" fill="#f0f0f5"/>
  <text x="800" y="196" font-family="Arial" font-size="18" font-weight="700" fill="#333" text-anchor="middle">午餐小天使</text>
  <!-- chat bubbles -->
  <rect x="656" y="250" width="200" height="44" rx="16" fill="url(#chat2)"/>
  <text x="676" y="278" font-family="Arial" font-size="15" fill="#333">今天午餐吃什麼？</text>
  <rect x="720" y="318" width="224" height="56" rx="16" fill="url(#chat1)"/>
  <text x="740" y="340" font-family="Arial" font-size="15" fill="#fff">今天午餐：</text>
  <text x="740" y="362" font-family="Arial" font-size="14" font-weight="700" fill="#fff">香煎小管・花枝丸・時蔬</text>
  <rect x="656" y="398" width="180" height="44" rx="16" fill="url(#chat2)"/>
  <text x="676" y="426" font-family="Arial" font-size="15" fill="#333">好讚，謝謝你！</text>
  <rect x="720" y="466" width="160" height="44" rx="16" fill="url(#chat1)"/>
  <text x="740" y="494" font-family="Arial" font-size="15" fill="#fff">不客氣～😊</text>
  <!-- title -->
  <text x="800" y="120" font-family="-apple-system,'PingFang TC','Microsoft JhengHei',Arial,sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle">午餐小天使</text>
  <text x="800" y="165" font-family="-apple-system,'PingFang TC','Microsoft JhengHei',Arial,sans-serif" font-size="26" fill="#b8a8d8" text-anchor="middle">LINE 聊天機器人・校園午餐查詢</text>
</svg>

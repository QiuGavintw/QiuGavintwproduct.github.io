<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="教室座位編排工具預覽示意圖（非實機截圖）">
  <title>教室座位編排工具預覽示意圖</title>
  <desc>以深色背景呈現教室座位編排工具的示意圖，包含排排坐與分組兩種版面，可拖曳調整座位並匯出。</desc>
  <rect width="1200" height="675" fill="#0b1220"/>
  <rect x="0" y="0" width="1200" height="72" fill="#111a2e"/>
  <text x="600" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="26" text-anchor="middle" font-weight="bold">教室座位編排工具</text>
  <text x="600" y="118" fill="#64748b" font-family="sans-serif" font-size="18" text-anchor="middle">Classroom Seating Arranger ・ 排排坐 / 分組 ・ 拖曳調整 / 匯出</text>

  <!-- 黑板 -->
  <rect x="360" y="150" width="480" height="46" rx="8" fill="#1e3a5f" stroke="#2b4d78" stroke-width="2"/>
  <text x="600" y="180" fill="#93b4d8" font-family="sans-serif" font-size="18" text-anchor="middle">講 台</text>

  <!-- 座位格 (5 欄 x 3 列) -->
  <g>
    <!-- Row 1 -->
    <g font-family="sans-serif" font-size="16" text-anchor="middle">
      <rect x="200" y="250" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="255" y="298" fill="#e2e8f0">1</text>
      <rect x="330" y="250" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="385" y="298" fill="#e2e8f0">2</text>
      <rect x="460" y="250" width="110" height="80" rx="10" fill="#2563eb" stroke="#3b82f6" stroke-width="3"/><text x="515" y="298" fill="#fff">3</text>
      <rect x="590" y="250" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="645" y="298" fill="#e2e8f0">4</text>
      <rect x="720" y="250" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="775" y="298" fill="#e2e8f0">5</text>

      <!-- Row 2 -->
      <rect x="200" y="350" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="255" y="398" fill="#e2e8f0">6</text>
      <rect x="330" y="350" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="385" y="398" fill="#e2e8f0">7</text>
      <rect x="460" y="350" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="515" y="398" fill="#e2e8f0">8</text>
      <rect x="590" y="350" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="645" y="398" fill="#e2e8f0">9</text>
      <rect x="720" y="350" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="775" y="398" fill="#e2e8f0">10</text>

      <!-- Row 3 -->
      <rect x="200" y="450" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="255" y="498" fill="#e2e8f0">11</text>
      <rect x="330" y="450" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="385" y="498" fill="#e2e8f0">12</text>
      <rect x="460" y="450" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="515" y="498" fill="#e2e8f0">13</text>
      <rect x="590" y="450" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="645" y="498" fill="#e2e8f0">14</text>
      <rect x="720" y="450" width="110" height="80" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="2"/><text x="775" y="498" fill="#e2e8f0">15</text>
    </g>
  </g>

  <!-- 底部操作列 -->
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <rect x="330" y="580" width="150" height="42" rx="10" fill="#2563eb"/>
    <text x="405" y="607" fill="#fff">排排坐</text>
    <rect x="500" y="580" width="150" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="575" y="607" fill="#94a3b8">分組</text>
    <rect x="670" y="580" width="200" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="770" y="607" fill="#94a3b8">匯出座位表 ↘</text>
  </g>
</svg>

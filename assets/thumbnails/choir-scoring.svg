<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="高一合唱評分計時台預覽示意圖（非實機截圖）">
  <title>高一合唱評分計時台預覽示意圖</title>
  <desc>深色控制室風格的評分計時台示意圖，包含大型倒數計時、指定曲與自選曲評分卡片、隊伍順序與排名。</desc>
  <rect width="1200" height="675" fill="#0b1220"/>
  <rect x="0" y="0" width="1200" height="72" fill="#111a2e"/>
  <text x="600" y="45" fill="#e2e8f0" font-family="sans-serif" font-size="26" text-anchor="middle" font-weight="bold">合唱比賽計時計分系統</text>
  <text x="600" y="116" fill="#64748b" font-family="sans-serif" font-size="18" text-anchor="middle">計時 / 評分 / 排名 / 匯出 ・ 純前端單頁工具</text>
  <rect x="80" y="150" width="640" height="210" rx="16" fill="#111a2e" stroke="#1e3a5f" stroke-width="2"/>
  <text x="400" y="190" fill="#93b4d8" font-family="sans-serif" font-size="18" text-anchor="middle">剩餘時間</text>
  <text x="400" y="292" fill="#f8fafc" font-family="monospace" font-size="84" text-anchor="middle" font-weight="bold">02:47</text>
  <rect x="130" y="325" width="540" height="12" rx="6" fill="#1e293b"/>
  <rect x="130" y="325" width="405" height="12" rx="6" fill="#f4a53d"/>
  <g font-family="sans-serif" font-size="17" text-anchor="middle">
    <rect x="80" y="390" width="305" height="160" rx="14" fill="#111a2e" stroke="#2b4d78" stroke-width="2"/>
    <text x="232" y="425" fill="#e2e8f0" font-weight="bold">指定曲 · 50%</text>
    <text x="232" y="465" fill="#94a3b8">音準、節奏、音色 50%</text>
    <text x="232" y="500" fill="#94a3b8">團體創意 50%</text>
    <text x="232" y="535" fill="#f4a53d">3 位評審平均</text>
    <rect x="415" y="390" width="305" height="160" rx="14" fill="#111a2e" stroke="#2b4d78" stroke-width="2"/>
    <text x="567" y="425" fill="#e2e8f0" font-weight="bold">自選曲 · 50%</text>
    <text x="567" y="465" fill="#94a3b8">音準、節奏、音色 40%</text>
    <text x="567" y="500" fill="#94a3b8">和聲 30% · 指揮 30%</text>
    <text x="567" y="535" fill="#f4a53d">最佳指揮獎</text>
  </g>
  <rect x="760" y="150" width="360" height="400" rx="16" fill="#111a2e" stroke="#1e3a5f" stroke-width="2"/>
  <text x="940" y="190" fill="#93b4d8" font-family="sans-serif" font-size="18" text-anchor="middle">出場順序</text>
  <g font-family="sans-serif" font-size="17">
    <rect x="790" y="215" width="300" height="42" rx="8" fill="#2563eb"/>
    <text x="940" y="243" fill="#fff" text-anchor="middle">01 · 目前隊伍</text>
    <text x="940" y="292" fill="#cbd5e1" text-anchor="middle">02 · 一年三班</text>
    <text x="940" y="334" fill="#cbd5e1" text-anchor="middle">03 · 一年信班</text>
    <text x="940" y="376" fill="#cbd5e1" text-anchor="middle">04 · 一年仁班</text>
    <text x="940" y="418" fill="#cbd5e1" text-anchor="middle">05 · 一年一班</text>
    <text x="940" y="460" fill="#64748b" text-anchor="middle">… 共 11 隊</text>
    <text x="940" y="512" fill="#94a3b8" text-anchor="middle">排名 · 超時扣分 · 歷史紀錄</text>
  </g>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <rect x="80" y="585" width="175" height="42" rx="10" fill="#2563eb"/>
    <text x="167" y="612" fill="#fff">開始 / 暫停</text>
    <rect x="275" y="585" width="145" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="347" y="612" fill="#94a3b8">設定</text>
    <rect x="440" y="585" width="145" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="512" y="612" fill="#94a3b8">儲存紀錄</text>
    <rect x="605" y="585" width="115" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="662" y="612" fill="#94a3b8">匯出 ↘</text>
    <rect x="760" y="585" width="360" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="940" y="612" fill="#94a3b8">CSV / Excel / 列印 HTML</text>
  </g>
</svg>

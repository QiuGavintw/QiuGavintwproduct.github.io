  <style>
    /* ========== tokens ========== */
    :root {
      --paper: #f3f2ed;
      --paper-2: #eae8e0;
      --plate: #fbfaf6;
      --ink: #171716;
      --ink-soft: #565550;
      --ink-faint: #8b897f;
      --rule: #d7d3c7;
      --rule-strong: #b9b4a5;
      --accent: #1f4bd8;
      --accent-soft: rgba(31, 75, 216, 0.10);

      --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --display: "Playfair Display", Georgia, "Times New Roman", serif;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

      --container: 1240px;
      --gutter: clamp(20px, 4vw, 56px);
      --radius: 2px;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    [data-theme="dark"] {
      --paper: #17171a;
      --paper-2: #1f1f24;
      --plate: #1c1c21;
      --ink: #edeae4;
      --ink-soft: #b9b6ac;
      --ink-faint: #7d7a71;
      --rule: #35343a;
      --rule-strong: #4b4a51;
      --accent: #7c95ff;
      --accent-soft: rgba(124, 149, 255, 0.14);
    }

    /* ========== reset ========== */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.0625rem;
      line-height: 1.65;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      text-wrap: pretty;
    }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p, dl, dd, dt, figure { margin: 0; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .wrap { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
    .mono { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.02em; }
    .rule { height: 1px; background: var(--rule); border: 0; }

    /* ========== header ========== */
    .site-head {
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
    }
    .head-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; min-height: 60px;
    }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand-mark {
      font-family: var(--display); font-weight: 900; font-size: 1.35rem;
      letter-spacing: -0.02em; line-height: 1;
    }
    .brand-sub { color: var(--ink-faint); }
    .head-meta { display: flex; align-items: center; gap: 18px; }
    .head-meta .mono { color: var(--ink-soft); }
    .theme-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border: 1px solid var(--rule-strong); border-radius: var(--radius);
      color: var(--ink-soft);
    }
    .theme-btn:hover { color: var(--ink); border-color: var(--ink); }
    @media (max-width: 720px) { .head-meta .mono.hide-sm { display: none; } }

    /* ========== hero ========== */
    .hero { padding-block: clamp(48px, 9vw, 112px) clamp(40px, 6vw, 72px); }
    .hero-grid {
      display: grid; grid-template-columns: 7fr 5fr;
      gap: clamp(32px, 6vw, 88px); align-items: end;
    }
    .hero-kicker {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--ink-faint); margin-bottom: 22px;
    }
    .hero-kicker::before {
      content: ""; width: 28px; height: 1px; background: var(--rule-strong);
    }
    .hero-title {
      font-family: var(--display); font-weight: 700;
      font-size: clamp(2.55rem, 6vw, 5.1rem);
      line-height: 0.98; letter-spacing: -0.022em;
      max-width: 12em;
    }
    .hero-title em { font-style: italic; color: var(--accent); }
    .hero-lede {
      margin-top: 26px; max-width: 34em; color: var(--ink-soft);
      font-size: clamp(1.05rem, 1.4vw, 1.2rem); line-height: 1.6;
    }
    .hero-stats {
      margin-top: 30px; display: flex; flex-wrap: wrap; gap: 8px 22px;
      color: var(--ink-faint);
    }
    .hero-stats b { color: var(--ink); font-weight: 500; }

    /* specimen (featured) */
    .specimen { border: 1px solid var(--rule); background: var(--plate); }
    .specimen-plate { position: relative; display: block; overflow: hidden; aspect-ratio: 16 / 10; background: var(--paper-2); }
    .specimen-plate img { width: 100%; height: 100%; object-fit: cover; }
    .specimen-tab {
      position: absolute; top: 0; left: 0;
      font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.04em;
      color: var(--plate); background: var(--ink); padding: 6px 10px;
    }
    .specimen-label { padding: 20px 22px 22px; border-top: 1px solid var(--rule); }
    .specimen-label .lbl {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 0.7rem; color: var(--ink-faint);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .specimen-label h2 {
      font-family: var(--display); font-weight: 700; font-size: 1.7rem;
      letter-spacing: -0.01em; margin-top: 8px;
    }
    .specimen-label p { margin-top: 8px; color: var(--ink-soft); font-size: 0.98rem; }
    .specimen-meta { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-faint); }
    .specimen-link {
      margin-top: 18px; display: inline-flex; align-items: center; gap: 6px;
      color: var(--accent); border-bottom: 1px solid currentColor; padding-bottom: 2px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-faint)); display: inline-block; }

    /* ========== index ========== */
    .index-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 24px; padding-block: 14px; border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--rule);
    }
    .index-head h2 {
      font-family: var(--display); font-weight: 700; font-size: clamp(1.25rem, 2vw, 1.6rem);
      letter-spacing: -0.01em;
    }
    .index-head .mono { color: var(--ink-faint); }

    .index-layout {
      display: grid; grid-template-columns: 240px 1fr;
      gap: clamp(24px, 4vw, 56px); padding-block: clamp(28px, 4vw, 44px) 96px;
    }

    /* rail */
    .rail { position: sticky; top: 84px; align-self: start; }
    .rail-label { color: var(--ink-faint); margin-bottom: 12px; }
    .filter-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
    .filter-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 9px 0; text-align: left;
      font-family: var(--serif); font-size: 1rem; color: var(--ink-soft);
      border-bottom: 1px solid var(--rule);
    }
    .filter-btn .count { font-family: var(--mono); font-size: 0.74rem; color: var(--ink-faint); }
    .filter-btn:hover { color: var(--ink); }
    .filter-btn.is-active { color: var(--ink); }
    .filter-btn.is-active .name { position: relative; }
    .filter-btn.is-active .name::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
      height: 2px; background: var(--accent);
    }
    .filter-btn.is-active .count { color: var(--accent); }
    .rail-note { margin-top: 22px; color: var(--ink-faint); line-height: 1.5; }

    /* grid */
    .plates {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: clamp(20px, 2.4vw, 34px) clamp(20px, 2.4vw, 30px);
    }
    .plate {
      display: flex; flex-direction: column;
      border-top: 1px solid var(--ink);
      padding-top: 0;
      opacity: 0; transform: translateY(12px);
    }
    .plate.is-in { opacity: 1; transform: none; transition: opacity 0.6s var(--ease), transform 0.6s var(--ease); transition-delay: var(--d, 0ms); }
    .plate-media {
      position: relative; display: block; overflow: hidden;
      aspect-ratio: 4 / 3; background: var(--paper-2); margin-top: 14px;
    }
    .plate-media img {
      width: 100%; height: 100%; object-fit: cover;
      filter: saturate(0.9); transition: transform 0.5s var(--ease), filter 0.5s var(--ease);
    }
    .plate:hover .plate-media img { transform: scale(1.035); filter: saturate(1); }
    .plate-tab {
      position: absolute; top: 0; left: 0; font-family: var(--mono); font-size: 0.68rem;
      letter-spacing: 0.04em; color: var(--plate); background: var(--ink); padding: 5px 9px;
    }
    .badge-dev {
      position: absolute; bottom: 10px; left: 10px;
      font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.04em;
      background: var(--paper); color: var(--ink); border: 1px solid var(--ink);
      padding: 4px 8px;
    }
    .plate-body { padding-top: 14px; display: flex; flex-direction: column; flex: 1; }
    .plate-title {
      font-family: var(--display); font-weight: 600; font-size: 1.28rem;
      line-height: 1.15; letter-spacing: -0.01em;
    }
    .plate-title a:hover { color: var(--accent); }
    .plate-desc { margin-top: 8px; color: var(--ink-soft); font-size: 0.95rem; line-height: 1.55; }
    .plate-meta {
      margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
      color: var(--ink-faint); font-family: var(--mono); font-size: 0.7rem;
    }
    .plate-meta .sep { color: var(--rule-strong); }
    .plate-actions {
      margin-top: auto; padding-top: 16px; display: flex; align-items: center; gap: 18px;
    }
    .link-open { color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 1px; font-size: 0.92rem; }
    .link-open:hover { color: var(--accent); border-color: var(--accent); }
    .link-sec { color: var(--ink-faint); font-size: 0.86rem; }
    .link-sec:hover { color: var(--ink); }
    .link-disabled { color: var(--ink-faint); font-size: 0.9rem; cursor: default; }

    .empty-note { display: none; color: var(--ink-faint); font-style: italic; padding: 40px 0; }
    .empty-note.show { display: block; }

    /* ========== footer ========== */
    .site-foot { border-top: 1px solid var(--rule); padding-block: 32px 56px; }
    .foot-inner { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: baseline; justify-content: space-between; color: var(--ink-faint); }
    .foot-inner a { border-bottom: 1px solid currentColor; }

    /* ========== responsive ========== */
    @media (max-width: 1024px) {
      .hero-grid { grid-template-columns: 1fr; align-items: start; }
      .specimen { max-width: 560px; }
      .index-layout { grid-template-columns: 1fr; }
      .rail { position: static; }
      .filter-list { flex-direction: row; flex-wrap: wrap; gap: 0 20px; }
      .filter-btn { width: auto; border-bottom: 0; padding: 6px 0; gap: 8px; }
      .rail-note { display: none; }
      .plates { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .plates { grid-template-columns: 1fr; }
      .brand-sub { display: none; }
      .hero-title { max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .plate { opacity: 1; transform: none; transition: none; }
      .plate-media img { transition: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>

      var openHTML;
      if (p.dev) {
        openHTML = '<span class="link-disabled mono">開發中</span>';
      } else if (primary) {
        openHTML = '<a class="link-open" href="' + primary + '"' +
          (p.external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>打開 <span aria-hidden="true">↗</span></a>';
      } else { openHTML = ''; }

      var secHTML = sec
        ? '<a class="link-sec" href="' + sec.href + '"' +
          ((p.external || /^https?:/.test(sec.href)) ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' +
          sec.label + '</a>'
        : '';

      var tabHref = p.dev ? (p.detail || "#") : (primary || p.detail || "#");
      var tabTarget = (!p.dev && p.external) ? ' target="_blank" rel="noopener noreferrer"' : '';

      var badge = p.dev ? '<span class="badge-dev">開發中</span>' : '';

      var headCat = p.cats[0];
      var techStr = p.tech.slice(0, 2).join(" / ");

      return '' +
        '<article class="plate" data-cats="' + p.cats.join(" ") + '" style="--d:' + (i * 55) + 'ms">' +
          '<a class="plate-media" href="' + tabHref + '"' + tabTarget + ' tabindex="-1" aria-hidden="true">' +
            '<img loading="lazy" decoding="async" src="' + p.thumb + '" alt="' + p.title + ' 預覽畫面">' +
            '<span class="plate-tab">' + p.n + '</span>' +
            badge +
          '</a>' +
          '<div class="plate-body">' +
            '<h3 class="plate-title"><a href="' + tabHref + '"' + tabTarget + '>' + p.title + '</a></h3>' +
            '<p class="plate-desc">' + p.short + '</p>' +
            '<div class="plate-meta">' +
              '<span class="dot" style="--c:' + p.accent + '"></span>' +
              '<span>' + headCat + '</span>' +
              '<span class="sep">·</span><span>' + techStr + '</span>' +
              '<span class="sep">·</span><span>' + fmtDate(p.date) + '</span>' +
            '</div>' +
            '<div class="plate-actions">' + openHTML + secHTML + '</div>' +
          '</div>' +
        '</article>';
    }

    var grid = document.querySelector("[data-plates]");
    var filtersEl = document.querySelector("[data-filters]");
    var emptyEl = document.querySelector("[data-empty]");
    var countEl = document.querySelector("[data-index-count]");

    grid.innerHTML = PROJECTS.map(plateHTML).join("");

    // filters
    var cats = [];
    PROJECTS.forEach(function (p) {
      p.cats.forEach(function (c) { if (cats.indexOf(c) === -1) cats.push(c); });
    });
    var order = ["遊戲", "教育", "工具", "視覺化", "資料分析"];
    cats.sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia === -1) ia = 99; if (ib === -1) ib = 99;
      return ia - ib;
    });

    function countOf(cat) {
      return PROJECTS.filter(function (p) { return cat === "全部" || p.cats.indexOf(cat) !== -1; }).length;
    }

    var allCats = ["全部"].concat(cats);
    filtersEl.innerHTML = allCats.map(function (c, i) {
      return '<li><button class="filter-btn' + (i === 0 ? " is-active" : "") + '" type="button" data-filter="' + c + '">' +
        '<span class="name">' + c + '</span><span class="count">' + String(countOf(c)).padStart(2, "0") + '</span>' +
        '</button></li>';
    }).join("");

    function applyFilter(cat) {
      var shown = 0;
      Array.prototype.forEach.call(grid.querySelectorAll(".plate"), function (el) {
        var catsAttr = el.getAttribute("data-cats") || "";
        var ok = cat === "全部" || (" " + catsAttr + " ").indexOf(" " + cat + " ") !== -1;
        el.style.display = ok ? "" : "none";
        if (ok) shown++;
      });
      if (countEl) countEl.textContent = cat === "全部" ? ("共 " + shown + " 件") : (cat + " · " + shown + " 件");
      emptyEl.classList.toggle("show", shown === 0);
      reveal();
    }

    filtersEl.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-filter]");
      if (!btn) return;
      Array.prototype.forEach.call(filtersEl.querySelectorAll(".filter-btn"), function (b) {
        b.classList.toggle("is-active", b === btn);
      });
      applyFilter(btn.getAttribute("data-filter"));
    });

    // reveal
    function reveal() {
      var items = Array.prototype.filter.call(grid.querySelectorAll(".plate"), function (el) {
        return el.style.display !== "none";
      });
      if (reduceMotion || !("IntersectionObserver" in window)) {
        items.forEach(function (el) { el.classList.add("is-in"); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add("is-in"); io.unobserve(en.target); }
        });
      }, { threshold: 0.12 });
      items.forEach(function (el) { if (!el.classList.contains("is-in")) io.observe(el); });
    }

    // theme
    var root = document.documentElement;
    var tBtn = document.querySelector("[data-theme-btn]");
    var tLabel = document.querySelector("[data-theme-label]");
    function setTheme(t) {
      root.setAttribute("data-theme", t);
      if (tLabel) tLabel.textContent = t === "dark" ? "日間" : "夜讀";
      try { localStorage.setItem("qg-theme", t); } catch (e) {}
    }
    (function initTheme() {
      var saved = null;
      try { saved = localStorage.getItem("qg-theme"); } catch (e) {}
      var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      setTheme(saved === "dark" || saved === "light" ? saved : (sysDark ? "dark" : "light"));
    })();
    if (tBtn) tBtn.addEventListener("click", function () {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    applyFilter("全部");
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高一合唱・評分計時台</title>
  <link rel="icon" href="LOGO-Brand.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // 提前套用主題，避免重新整理時閃一下深色
    (function () {
      var theme = 'dark';
      try { theme = JSON.parse(localStorage.getItem('mcts.theme') || '"dark"'); } catch (e) { theme = 'dark'; }
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      var view = 'full';
      try { view = JSON.parse(localStorage.getItem('mcts.view') || '"full"'); } catch (e) { view = 'full'; }
      document.documentElement.setAttribute('data-view', view === 'score' ? 'score' : 'full');
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">高一合唱・評分計時台<small>CHOIR CONTEST CONSOLE</small></div>
    <span id="status-badge" class="status">未開始</span>
    <button id="btn-settings" class="btn" type="button">設定</button>
    <button id="btn-theme" class="btn" type="button" aria-pressed="false">明亮模式</button>
    <button id="btn-mode" class="btn" type="button" aria-pressed="false">登記分數模式</button>
    <div class="export-wrap">
      <button id="btn-export" class="btn primary" type="button" aria-expanded="false">匯出 ▾</button>
      <div id="export-menu" class="export-menu" hidden>
        <button id="btn-export-csv" type="button">CSV（Excel 可開）</button>
        <button id="btn-export-xls" type="button">Excel 相容 .xls</button>
        <button id="btn-export-print" type="button">列印 / PDF 頁面</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="stage" aria-label="目前隊伍與計時">
      <p class="eyebrow">目前隊伍</p>
      <h1 id="current-team-name" class="team-now">一年5班</h1>
      <div class="timer-grid">
        <div class="timer-cell" id="countdown-cell">
          <div class="timer-label">倒數時間</div>
          <div id="countdown-time" class="timer-number">05:00.00</div>
        </div>
        <div class="timer-cell" id="forward-cell">
          <div class="timer-label">正數時間</div>
          <div id="forward-time" class="timer-number">00:00.00</div>
        </div>
      </div>
      <div class="control-row">
        <button id="btn-start" class="btn primary" type="button">開始</button>
        <button id="btn-pause" class="btn" type="button" disabled>暫停</button>
        <button id="btn-reset" class="btn" type="button">重置</button>
        <button id="btn-save" class="btn" type="button">儲存紀錄</button>
      </div>
      <div id="reminder-message" class="reminder-message" role="status" aria-live="polite"></div>
    </section>

    <aside class="queue" aria-label="出場順序">
      <h2>出場順序</h2>
      <div id="team-list" class="team-list"></div>
      <button id="btn-add-team" class="btn add-team" type="button">＋ 新增隊伍</button>
    </aside>

    <nav class="tabs" role="tablist" aria-label="功能分頁">
      <button class="tab" type="button" role="tab" aria-selected="true" data-target="score">評分輸入</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-target="history">歷史紀錄</button>
    </nav>

    <section id="panel-score" class="panel" role="tabpanel">
      <div class="panel-heading score-heading">
        <p class="eyebrow">評分輸入 · 依評分表細項 · 0–100 分 · 三位評審 · 未填寫不計入試算</p>
        <label class="score-team-picker">目前隊伍
          <select id="score-team-select" aria-label="選擇要登記分數的隊伍"></select>
        </label>
      </div>
      <div id="score-fields" class="score-grid"></div>
      <div class="score-sum">
        <div>指定曲得分<strong id="sum-designated">—</strong></div>
        <div>自選曲得分<strong id="sum-self">—</strong></div>
        <div class="deduct">超時扣分<strong id="sum-deduct">0.00</strong></div>
        <div>總得分<strong id="sum-total">—</strong></div>
        <div>已存排名<strong id="sum-rank">—</strong></div>
      </div>
      <p id="score-hint" class="score-hint" role="status"></p>
      <div class="score-actions">
        <button id="btn-save-score" class="btn" type="button">儲存這隊分數草稿</button>
        <button id="btn-save-record-score" class="btn primary" type="button">儲存紀錄</button>
      </div>
    </section>

    <section id="panel-history" class="panel" role="tabpanel" hidden>
      <div class="panel-heading">
        <p class="eyebrow">歷史紀錄</p>
        <button id="btn-clear-history" class="btn danger" type="button">清除歷史紀錄</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>隊伍</th><th>正數時間</th><th>超過時間</th><th>超時扣分</th><th>總得分</th><th>排名</th><th>最佳指揮獎</th></tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
        <p id="history-empty" class="empty-note">尚無紀錄</p>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div id="modal-dialog" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/history.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
